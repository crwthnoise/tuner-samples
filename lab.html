<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* MODULE LAB lab-10 — the module at its REAL app size, one loop, A/B. Sound code = modules/*.js (same files the app uses). */
:root{ --void:#0a0804; --red:#d32f2f; --green:#4fd1a5; --text:#f2ede2; --mute:#8a8176; --faint:#4a443d;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --ui:'Jura','Arial Narrow',system-ui,sans-serif; color-scheme:dark; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--void); color:var(--text); font-family:var(--ui); overflow:hidden; overscroll-behavior:none; touch-action:none; }
body{ position:fixed; inset:0; display:flex; flex-direction:column; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px); max-width:520px; margin:0 auto; user-select:none; -webkit-user-select:none; }
.z{ position:relative; background:linear-gradient(#1c1a17,#0e0d0b); border-radius:10px; box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 10px #000; padding:10px 12px; }
.top{ display:flex; align-items:center; gap:10px; }
.top h1{ margin:0; flex:1; font:700 15px var(--ui); letter-spacing:.32em; }
.top h1 b{ color:var(--red); }
.top h1 small{ display:block; font:300 9px var(--ui); letter-spacing:.5em; color:var(--mute); margin-top:2px; }
.lcd{ background:#040605; border:2px solid #1a1a1a; border-radius:6px; padding:5px 8px; font:700 15px var(--mono); color:var(--green); text-shadow:0 0 6px #4fd1a588; min-width:60px; text-align:center; }
.lcd i{ display:block; font:700 7px var(--mono); color:#2f7a60; letter-spacing:.2em; font-style:normal; text-shadow:none; }
.chips{ display:flex; gap:6px; }
.chips button{ flex:1; height:40px; border-radius:8px; border:1px solid #2a2724; background:linear-gradient(#22201c,#141210); color:var(--mute); font:700 13px var(--mono); letter-spacing:.14em; cursor:pointer; }
.chips button.on{ color:#000; background:var(--a,#f2ede2); border-color:var(--a,#f2ede2); }
/* the rack band: whole band = slider (drag up/down anywhere), module sits at real app size */
#band{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; gap:2px; touch-action:none; cursor:ns-resize; }
.ghost{ width:var(--mw); height:var(--mh); border-radius:4px; border:1px dashed #2a2622; opacity:.5; flex:none; }
#slot{ width:var(--mw); height:var(--mh); position:relative; flex:none; }
#slot > .mod{ transform:scale(var(--rs)); transform-origin:top left; pointer-events:none; }
.readout{ font:700 12px var(--mono); color:var(--mute); text-align:center; letter-spacing:.06em; min-height:16px; }
.readout b{ color:var(--a); }
.row{ display:flex; gap:8px; align-items:center; }
.row label{ font:700 9px var(--mono); letter-spacing:.18em; color:var(--mute); flex:none; }
select{ flex:1; min-width:0; width:100%; height:38px; border-radius:7px; border:1px solid #2a2724; background:#141210; color:var(--text); font:700 11px var(--mono); padding:0 8px; text-overflow:ellipsis; }
.dock{ display:flex; gap:10px; align-items:center; }
.btn{ height:40px; border-radius:7px; border:1px solid #2a2724; background:linear-gradient(#22201c,#141210); color:var(--mute); font:700 12px var(--mono); letter-spacing:.08em; cursor:pointer; box-shadow:0 2px 0 #000; }
#sw{ flex:1; height:74px; font-size:14px; }
#sw.on{ color:#000; background:var(--a); border-color:var(--a); box-shadow:0 0 16px var(--a); }
#ab{ width:74px; height:74px; font-size:13px; }
#ab.dry{ color:var(--text); border-color:#5a5550; }
#play{ flex:none; width:88px; height:88px; border-radius:50%; border:3px solid var(--red); background:radial-gradient(circle,#2a2622,#0e0c0a 70%); box-shadow:0 0 18px #d32f2f55,inset 0 0 0 6px #0a0908; color:var(--text); font-size:30px; cursor:pointer; }
.note{ font:500 10px var(--mono); color:var(--faint); text-align:center; }
/* CHAIN panel (lab-10) — for designing the sound: every unit + its live settings + meters. LAB only, never in the app. */
#chain{ padding:6px 10px; font:500 10px var(--mono); }
#chain h3{ margin:0; display:flex; align-items:center; gap:8px; font:700 10px var(--mono); letter-spacing:.2em; color:var(--mute); cursor:pointer; }
#chain h3 span{ flex:1; }
#meters{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-top:6px; }
.mt{ font:700 7px var(--mono); color:var(--mute); letter-spacing:.1em; }
.mt div{ height:6px; background:#060505; border-radius:2px; overflow:hidden; margin-top:2px; }
.mt b{ display:block; height:100%; width:0; background:var(--c); }
.mt em{ font-style:normal; color:var(--text); float:right; }
#units{ margin-top:6px; display:flex; flex-direction:column; gap:2px; }
.un{ display:grid; grid-template-columns:14px 88px 1fr; gap:4px; align-items:baseline; line-height:13px; }
.un i{ font-style:normal; color:var(--faint); }
.un b{ color:var(--a); font-weight:700; }
.un span{ color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.un.off b, .un.off span{ color:var(--faint); }
.un small{ display:none; grid-column:3; color:var(--faint); font-size:8.5px; line-height:10px; margin-top:-1px; }
.un.open small{ display:block; }
.un{ cursor:pointer; }
#chain{ max-height:46vh; overflow-y:auto; touch-action:pan-y; }
.tools{ display:flex; gap:6px; margin-top:6px; }
.tools button{ flex:1; height:30px; border-radius:6px; border:1px solid #2a2724; background:linear-gradient(#22201c,#141210); color:var(--text); font:700 10px var(--mono); letter-spacing:.08em; cursor:pointer; }
.tools button.hot{ color:#000; background:var(--a); border-color:var(--a); }
.un.chg b::after{ content:' •'; color:#ffb347; }
.kn{ grid-column:2 / 4; display:none; flex-direction:column; gap:4px; padding:4px 0 6px; }
.un.open .kn{ display:flex; }
.kr{ display:grid; grid-template-columns:62px 1fr 52px; gap:6px; align-items:center; }
.kr label{ color:var(--mute); font-size:9px; }
.kr em{ font-style:normal; color:var(--text); text-align:right; font-size:9.5px; }
.kr input{ width:100%; accent-color:var(--a); height:22px; }
.kd{ display:flex; gap:6px; }
.kd button{ height:24px; padding:0 10px; border-radius:5px; border:1px solid #2a2724; background:#141210; color:var(--text); font:700 9px var(--mono); cursor:pointer; }
#chain.shut .tools, #chain.shut #units, #chain.shut #meters{ display:none; }
/* module box — same CSS as the app */
.mod{ position:relative; display:flex; flex-direction:column; align-items:center; box-shadow:0 6px 14px #000,inset 0 1px 0 rgba(255,255,255,.1); overflow:hidden; border:1px solid #000; font-family:var(--ui); }
.slot{ width:66px; height:330px; border-radius:4px; padding:16px 0 10px; }
.screw{ position:absolute; width:6px; height:6px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#d8d2c8,#6a645c 60%,#2a2622); z-index:4; }
.plate{ font-weight:700; white-space:nowrap; z-index:5; font-size:7px; letter-spacing:.5px; line-height:10px; padding:2px 3px; margin-bottom:8px; max-width:58px; overflow:hidden; border-radius:2px; }
.zone{ flex:1; width:100%; position:relative; container-type:size; overflow:hidden; }
.sw2{ width:46px; height:26px; margin-top:8px; border-radius:13px; position:relative; z-index:5; background:linear-gradient(#0c0b0a,#1a1816); box-shadow:inset 0 2px 3px #000,0 0 0 1px #3a3630; }
.sw2 i{ position:absolute; top:50%; left:50%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:#2a2622; box-shadow:inset 0 1px 1px #000; }
.sw2.on{ box-shadow:inset 0 2px 3px #000,0 0 0 1.5px var(--a),0 0 10px var(--a); }
.sw2.on i{ background:var(--a); box-shadow:0 0 8px 2px var(--a); }
.scr{ position:absolute; inset:0 10%; background:#040605; border:2px solid #1a1a1a; border-radius:3px; box-shadow:inset 0 0 14px #000; overflow:hidden; }
svg.f{ position:absolute; inset:0; width:100%; height:100%; }
</style>
<script src="modules/sky.js?v=lab-10"></script>
<script src="modules/rage.js?v=lab-10"></script>
</head><body>
<div class="z top">
  <h1><b>THREAT</b> TUNER<small>MODULE LAB</small></h1>
  <div class="lcd" id="bpmLcd">—<i>BPM</i></div>
</div>
<div class="chips" id="chips"></div>
<div class="z" id="band"><div class="ghost"></div><div class="ghost"></div><div id="slot"></div><div class="ghost"></div><div class="ghost"></div></div>
<div class="readout" id="readout">drag up / down anywhere in the rack</div>
<div class="z" id="chain"><h3 id="chainH"><span>🔧 CHAIN</span><em id="chainT">▾</em></h3><div id="meters"></div><div class="tools"><button id="pDice">🎲 ALL</button><button id="pReset">↺ RESET</button><button id="pCopy">📋 COPY</button></div><div id="units"></div></div>
<div class="row"><label>LOOP</label><select id="loopSel"></select></div>
<div class="dock">
  <button class="btn" id="ab">A/B</button>
  <button class="btn" id="sw">SWITCH</button>
  <button id="play" aria-label="play">▶</button>
</div>
<div class="note">lab-10 · module at real app size</div>
<script>
const $ = id=>document.getElementById(id);
const clamp = (v,a,b)=>Math.min(b, Math.max(a, v));
const SCREWS = '<div class="screw" style="top:6px;left:6px"></div><div class="screw" style="top:6px;right:6px"></div><div class="screw" style="bottom:6px;left:6px"></div><div class="screw" style="bottom:6px;right:6px"></div>';
function quipuHash(a, b, seed){ let h = Math.imul(a|0, 374761393) ^ Math.imul(b|0, 668265263) ^ Math.imul(seed|0, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

/* ---------- the modules on the bench ---------- */
const MODS = {
  QUIPU: { name:'QUIPU', acc:'#e0a060', screws:true, sw:'🎲 PATTERN', oneShot:true,
    face:'repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),linear-gradient(#2a1810 0 9%,#7a2a18 9% 11%,#2a1810 11% 86%,#7a2a18 86% 88%,#2a1810 88%)',
    worklets:['modules/quipu.worklet.js'],
    g(v, st){ const seed = st.seed, S = 8, cols = ['#e8dcc4','#e0a060','#c84a28','#8a5a30','#f2ede2','#b07840','#d8b880','#a03a20'];
      let s = '<line x1="2" y1="8" x2="98" y2="8" stroke="#e8dcc4" stroke-width="4"/>';
      for(let i=0;i<S;i++){ const x = 7 + i*12.3; s += `<line x1="${x}" y1="8" x2="${x}" y2="296" stroke="${i === st.slice ? '#fff' : cols[i]}" stroke-width="${i === st.slice ? 4 : 2.4}" opacity=".9"/>`; }
      for(let i=0;i<S;i++){ const swap = quipuHash(i,1,seed) < v, m = swap ? Math.floor(quipuHash(i,2,seed)*S) : i, x = 7 + i*12.3, y = 26 + m*32;
        s += `<rect x="${x-5}" y="${y-6}" width="10" height="12" rx="4" fill="${swap ? '#ffcf8a' : '#3a2414'}" stroke="${swap ? '#e0a060' : '#6a4a2a'}" stroke-width="1.5"/>`; }
      return `<div class="scr" style="background:#060403;border-color:#120a06"><svg class="f" viewBox="0 0 100 300" preserveAspectRatio="none">${s}</svg></div>`; },
    build(ac, st){ const node = new AudioWorkletNode(ac, 'quipu', { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[2] });
      node.port.onmessage = e=>{ if(e.data.pos){ st.slice = +e.data.pos.split(':')[1]; draw(); } };
      return { in:node, out:node, node, set(v){ node.parameters.get('amount').setTargetAtTime(v, ac.currentTime, 0.01); node.parameters.get('reroll').value = 0; node.port.postMessage({ seed:st.seed }); },
        transport(o){ node.port.postMessage(o); } }; },
  },
  SKY: Object.assign({}, window.TUNER_MODS.SKY, { build(ac){ const n = window.TUNER_MODS.SKY.build(ac); return { in:n.in, out:n.out, set(v, sw){ n.set(v, sw, ac.currentTime); } }; } }),
  RAGE: Object.assign({}, window.TUNER_MODS.RAGE, { build(ac){ const n = window.TUNER_MODS.RAGE.build(ac, loadP('RAGE')); return { _n:n, in:n.in, out:n.out, set(v, sw){ n.set(v, sw, ac.currentTime); } }; } }),
};
const ORDER = ['QUIPU','SKY','RAGE'];
/* your tweaks to a module's inner knobs live here (this phone only) until you COPY them to chat and they become the real defaults */
function loadP(k){ try{ return JSON.parse(localStorage.getItem('labP_' + k) || '{}'); }catch(e){ return {}; } }
function saveP(k, P, defs){ const ch = {}; defs.forEach(p=>{ if(Math.abs(P[p.k] - p.def) > 1e-9) ch[p.k] = +(+P[p.k]).toPrecision(4); }); try{ localStorage.setItem('labP_' + k, JSON.stringify(ch)); }catch(e){} return ch; }

const st = { mod:'RAGE', v:{ QUIPU:.5, SKY:.6, RAGE:.5 }, sw:{ SKY:false, RAGE:false }, seed:7, slice:-1, wet:true, playing:false, loop:null };
try{ const s = JSON.parse(localStorage.getItem('lab5') || '{}'); Object.assign(st, s, { playing:false, slice:-1 }); st.v = Object.assign({ QUIPU:.5, SKY:.6, RAGE:.5 }, st.v); st.sw = Object.assign({ SKY:false, RAGE:false }, st.sw); if(!s.lab6){ st.mod = 'RAGE'; } }catch(e){}
function save(){ try{ localStorage.setItem('lab5', JSON.stringify({ lab6:1, mod:st.mod, v:st.v, sw:st.sw, seed:st.seed, wet:st.wet, loop:st.loop })); }catch(e){} }
const M = ()=>MODS[st.mod];

/* ---------- audio ---------- */
let ctx = null, chain = {}, dry, wetBus, src = null, ready = null, an = null, anBuf = null;
function wake(){ /* called right inside the tap, before any await — phones only start sound inside the tap */
  if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if(ctx.state !== 'running'){ try{ ctx.resume(); }catch(e){} } }
async function boot(){ if(ready) return ready; ready = (async()=>{
  wake();
  const files = new Set(); ORDER.forEach(k=>(MODS[k].worklets||[]).forEach(f=>files.add(f)));
  for(const f of files){ try{ await ctx.audioWorklet.addModule(f + '?v=lab-10'); }catch(e){ console.warn('worklet failed', f, e); } }   /* one bad file never kills PLAY */
  dry = ctx.createGain(); wetBus = ctx.createGain(); const out = ctx.createGain(); out.gain.value = 0.85;
  dry.connect(out); wetBus.connect(out); out.connect(ctx.destination); an = ctx.createAnalyser(); an.fftSize = 512; wetBus.connect(an);
  ORDER.forEach(k=>{ try{ chain[k] = MODS[k].build(ctx, st); }catch(e){ console.warn('module failed', k, e); const g = ctx.createGain(); chain[k] = { in:g, out:g, set(){}, transport(){} }; } });
  ORDER.forEach(k=>{ const n = chain[k]._n; if(!n || !n.taps) return; chain[k]._an = {}; Object.entries(n.taps).forEach(([name, node])=>{ const a = ctx.createAnalyser(); a.fftSize = 1024; try{ node.connect(a); }catch(e){} chain[k]._an[name] = a; }); });
  route(); })(); ready.catch(()=>{ ready = null; }); return ready; }
function route(){ if(!ctx) return; ORDER.forEach(k=>{ try{ chain[k].out.disconnect(); }catch(e){} }); const c = chain[st.mod]; c.out.connect(wetBus); if(c._an && c._an.OUT) c.out.connect(c._an.OUT);   /* disconnect() above also drops the OUT meter */
  if(src){ try{ src.disconnect(); }catch(e){} src.connect(dry); src.connect(c.in); }
  apply(); }
function apply(){ if(!ctx) return; const c = chain[st.mod]; c.set(st.v[st.mod], !!st.sw[st.mod]); const t = ctx.currentTime;
  wetBus.gain.setTargetAtTime(st.wet ? 1 : 0, t, 0.006); dry.gain.setTargetAtTime(st.wet ? 0 : 1, t, 0.006); }

/* ---------- loops (same library + seamless AAC trim as the app) ---------- */
let LIB = [];
function fpDecode(b64){ const t = atob(b64), u = new Uint8Array(t.length); for(let i=0;i<t.length;i++) u[i] = t.charCodeAt(i); return new Int16Array(u.buffer); }
function trimLoop(s, ab){ if(!s.frames || !s.fp) return ab; const ratio = ab.sampleRate/(s.sr || 44100), len = Math.round(s.frames*ratio); if(len < 16 || ab.length < len) return ab;
  const fp = fpDecode(s.fp), sc = (s.fpScale || 1)/32767, nc = ab.numberOfChannels, chs = []; for(let c=0;c<nc;c++) chs.push(ab.getChannelData(c));
  const mono = i=>{ let v = 0; for(let c=0;c<nc;c++) v += chs[c][i]; return v/nc; };
  const idx = new Int32Array(fp.length); for(let i=0;i<fp.length;i++) idx[i] = Math.round((s.fpAt + i)*ratio);
  const maxD = Math.min(Math.round(6000*ratio), ab.length - len, ab.length - 1 - idx[idx.length-1]); let best = 0, bestE = Infinity;
  for(let d=0; d<=maxD; d++){ let e = 0; for(let i=0;i<fp.length;i++){ const x = mono(idx[i] + d) - fp[i]*sc; e += x*x; if(e >= bestE) break; } if(e < bestE){ bestE = e; best = d; } }
  const out = ctx.createBuffer(nc, len, ab.sampleRate); for(let c=0;c<nc;c++) out.getChannelData(c).set(chs[c].subarray(best, best + len)); return out; }
async function loadLib(){ try{ const r = await fetch('samples/index.json', { cache:'no-cache' }); LIB = (await r.json()).filter(s=>s.file && s.bpm); }catch(e){ LIB = []; }
  const sel = $('loopSel'); sel.innerHTML = ''; const folders = {}; LIB.forEach((s, k)=>{ (folders[s.folder || '—'] = folders[s.folder || '—'] || []).push(k); });
  Object.keys(folders).sort().forEach(f=>{ const g = document.createElement('optgroup'); g.label = f; folders[f].forEach(k=>{ const o = document.createElement('option'); o.value = LIB[k].id; o.textContent = LIB[k].name + ' · ' + LIB[k].bpm; g.appendChild(o); }); sel.appendChild(g); });
  const pick = LIB.find(s=>s.id === st.loop) || LIB.find(s=>/drum/i.test(s.folder || '')) || LIB[0]; if(pick){ sel.value = pick.id; st.loop = pick.id; } }
async function getBuffer(s){ if(s._buf) return s._buf; const r = await fetch('samples/' + s.file.split('/').map(encodeURIComponent).join('/')); const ab = await ctx.decodeAudioData(await r.arrayBuffer()); s._buf = trimLoop(s, ab); return s._buf; }
async function start(){ await boot(); if(ctx.state !== 'running') await ctx.resume(); stopSrc();
  const s = LIB.find(x=>x.id === st.loop); if(!s) return; $('readout').textContent = 'loading…';
  const buf = await getBuffer(s), bs = 60/s.bpm, beats = Math.max(1, Math.round(buf.duration/bs)), T = ctx.currentTime + 0.08;
  if(chain.QUIPU && chain.QUIPU.transport) chain.QUIPU.transport({ t0:T, bs, loopBeats:beats, seed:st.seed, reset:true });
  src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; route(); src.start(T);
  st.playing = true; $('play').textContent = '■'; $('bpmLcd').innerHTML = s.bpm + '<i>BPM</i>'; readout(); }
function stopSrc(){ if(src){ try{ src.stop(); }catch(e){} try{ src.disconnect(); }catch(e){} src = null; } }
function stop(){ stopSrc(); st.playing = false; st.slice = -1; $('play').textContent = '▶'; draw(); }

/* ---------- draw: the module at app size (rack of 12 on a phone) ---------- */
function layout(){ const W = Math.min(innerWidth, 520) - 32 - 24, n = 12, mw = (W - 2*(n-1))/n, rs = mw/66, mh = 330*rs;
  document.documentElement.style.setProperty('--mw', mw.toFixed(2) + 'px'); document.documentElement.style.setProperty('--mh', mh.toFixed(1) + 'px'); document.documentElement.style.setProperty('--rs', rs.toFixed(4)); }
function draw(){ const m = M(), v = st.v[st.mod], on = !!st.sw[st.mod];
  document.documentElement.style.setProperty('--a', m.acc);
  $('slot').innerHTML = `<div class="mod slot" style="background:${m.face}">${m.screws ? SCREWS : ''}<div class="plate" style="background:${m.acc};color:#000">${m.name}</div><div class="zone">${m.g(clamp(v,0,1), st)}</div><div class="sw2${on ? ' on' : ''}" style="--a:${m.acc}"><i></i></div></div>`;
  $('sw').textContent = m.sw || 'SWITCH'; $('sw').classList.toggle('on', !m.oneShot && on); }
function readout(){ const m = M(); $('readout').innerHTML = `${m.name} <b>${Math.round(st.v[st.mod]*100)}%</b>` + (!m.oneShot && st.sw[st.mod] ? ` · <b>${m.sw}</b>` : '') + (st.wet ? '' : ' · A = DRY'); }
function chips(){ $('chips').innerHTML = ''; ORDER.forEach(k=>{ const b = document.createElement('button'); b.textContent = k; b.style.setProperty('--a', MODS[k].acc); b.className = st.mod === k ? 'on' : ''; b.addEventListener('click', ()=>{ st.mod = k; chips(); route(); draw(); readout(); save(); chainShow(); }); $('chips').appendChild(b); }); }

/* drag anywhere in the rack band = the fader (no scrolling, no zoom) */
let drag = null;
const band = $('band');
band.addEventListener('touchstart', e=>e.preventDefault(), { passive:false });
document.addEventListener('touchmove', e=>{ if(!e.target.closest('select,input,#chain')) e.preventDefault(); }, { passive:false });
band.addEventListener('pointerdown', e=>{ try{ band.setPointerCapture(e.pointerId); }catch(_){} drag = { y0:e.clientY, v0:st.v[st.mod] }; });
band.addEventListener('pointermove', e=>{ if(!drag) return; const H = band.clientHeight * 0.8; st.v[st.mod] = clamp(drag.v0 - (e.clientY - drag.y0)/H, 0, 1); apply(); draw(); readout(); });
const end = ()=>{ if(drag){ drag = null; save(); } }; band.addEventListener('pointerup', end); band.addEventListener('pointercancel', end);

$('sw').addEventListener('click', ()=>{ const m = M(); if(m.oneShot){ let n; do{ n = 1 + Math.floor(Math.random()*100000); }while(n === st.seed); st.seed = n; }
  else st.sw[st.mod] = !st.sw[st.mod]; apply(); draw(); readout(); save(); });
$('ab').addEventListener('click', ()=>{ st.wet = !st.wet; $('ab').className = 'btn' + (st.wet ? '' : ' dry'); $('ab').textContent = st.wet ? 'A/B' : 'DRY'; apply(); readout(); save(); });
$('play').addEventListener('click', ()=>{ wake(); if(st.playing) stop(); else start().catch(e=>{ $('readout').textContent = 'could not play: ' + e.message; }); });
$('loopSel').addEventListener('change', e=>{ st.loop = e.target.value; save(); if(st.playing) start(); });
addEventListener('resize', ()=>{ layout(); draw(); });
/* audio react: modules with .react get the output level each frame (cheap: one opacity change) */
(function tick(){ requestAnimationFrame(tick); const m = M(); if(!m.react || !an) return; if(!anBuf) anBuf = new Float32Array(an.fftSize);
  let lvl = 0; if(st.playing && st.wet){ an.getFloatTimeDomainData(anBuf); let e = 0; for(let i=0;i<anBuf.length;i++) e += anBuf[i]*anBuf[i]; lvl = Math.sqrt(e/anBuf.length)*3; }
  m.react($('slot'), lvl); })();
/* ---------- CHAIN panel: what RAGE is really doing (units, settings, meters) ---------- */
const MC = { LOWS:'#4fd1a5', 'CLEAN HI':'#8a8176', RAGED:'#ff3b30', SCREAM:'#ffb347', OUT:'#f2ede2' };
let chainOpen = true; try{ chainOpen = localStorage.getItem('labChain') !== '0'; }catch(e){}
function chainShow(){
  $('chain').style.display = st.mod === 'RAGE' ? '' : 'none'; $('chain').classList.toggle('shut', !chainOpen); $('chainT').textContent = chainOpen ? '▾' : '▸'; }
$('chainH').addEventListener('click', ()=>{ chainOpen = !chainOpen; try{ localStorage.setItem('labChain', chainOpen ? '1' : '0'); }catch(e){} chainShow(); });
$('meters').innerHTML = Object.keys(MC).map(k=>`<div class="mt" style="--c:${MC[k]}">${k}<em id="mv${k.replace(' ','')}">—</em><div><b id="mb${k.replace(' ','')}"></b></div></div>`).join('');
function infoRows(){ const n = chain[st.mod] && chain[st.mod]._n; let rows = n && n.info ? n.info() : null;
  if(!rows){ $('units').innerHTML = '<div class="un"><i></i><b></b><span>press ▶ to see the chain live</span></div>'; return; }
  const defs = M().params || [], P = n.P || {};
  const html = rows.map((r, i)=>{ const ks = defs.filter(p=>p.u === r.u), chg = ks.some(p=>Math.abs(P[p.k] - p.def) > 1e-9);
    return `<div class="un${r.off ? ' off' : ''}${openNotes[r.u] ? ' open' : ''}${chg ? ' chg' : ''}" data-u="${r.u}"><i>${r.u === 'SCREAM' ? '+' : i + 1}</i><b>${r.u}</b><span>${r.s}</span>${r.note ? `<small>${r.note}</small>` : ''}`
      + (ks.length ? `<div class="kn">${ks.map(p=>`<div class="kr"><label>${p.l}</label><input type="range" min="0" max="1000" step="1" data-k="${p.k}" value="${Math.round(toPos(p, P[p.k])*1000)}"><em id="kv_${p.k}">${fmtP(p, P[p.k])}</em></div>`).join('')}<div class="kd"><button data-dice="${r.u}">🎲</button><button data-reset="${r.u}">↺</button></div></div>` : '') + `</div>`; }).join('');
  /* rebuild only when something changed and you're not dragging a knob (so the slider never jumps under your thumb) */
  const key = html.replace(/<span>[^<]*<\/span>/g, '');   /* the live numbers change every tick — only rebuild when the layout/knobs change */
  if(key !== lastUnits && !knobDrag){ lastUnits = key; $('units').innerHTML = html; }
  else { const sp = $('units').querySelectorAll('.un > span'); rows.forEach((r, i)=>{ if(sp[i] && sp[i].textContent !== r.s) sp[i].textContent = r.s; }); } }
let lastUnits = '', knobDrag = false;
const toPos = (p, v)=>p.log ? Math.log(v/p.min)/Math.log(p.max/p.min) : (v - p.min)/(p.max - p.min);
const fromPos = (p, x)=>{ let v = p.log ? p.min*Math.pow(p.max/p.min, x) : p.min + x*(p.max - p.min); if(p.step) v = Math.round(v/p.step)*p.step; return v; };
function fmtP(p, v){ if(p.names) return p.names[Math.round(v)]; if(p.unit === '%') return Math.round(v*100) + '%'; if(p.unit === 'Hz') return v >= 1000 ? (v/1000).toFixed(2) + 'k' : Math.round(v) + ''; return (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2)) + (p.unit && p.unit !== 'Hz' ? ' ' + p.unit : ''); }
function pChanged(){ const n = chain[st.mod] && chain[st.mod]._n; if(!n) return; n.apply && n.apply(); apply(); saveP(st.mod, n.P, M().params || []); lastUnits = ''; }
function dice(unit){ const n = chain[st.mod] && chain[st.mod]._n; if(!n){ $('readout').textContent = 'press ▶ first'; return; }
  (M().params || []).filter(p=>!unit || p.u === unit).forEach(p=>{ n.P[p.k] = fromPos(p, Math.random()); }); pChanged(); }
function resetP(unit){ const n = chain[st.mod] && chain[st.mod]._n; if(!n) return; (M().params || []).filter(p=>!unit || p.u === unit).forEach(p=>{ n.P[p.k] = p.def; }); pChanged(); }
$('units').addEventListener('input', e=>{ const k = e.target.dataset && e.target.dataset.k; if(!k) return; const n = chain[st.mod]._n, p = M().params.find(q=>q.k === k);
  knobDrag = true; n.P[k] = fromPos(p, e.target.value/1000); $('kv_' + k).textContent = fmtP(p, n.P[k]); n.apply && n.apply(); apply(); saveP(st.mod, n.P, M().params); });
$('units').addEventListener('change', ()=>{ knobDrag = false; lastUnits = ''; });
$('pDice').addEventListener('click', ()=>dice(null));
$('pReset').addEventListener('click', ()=>resetP(null));
$('pCopy').addEventListener('click', async ()=>{ const n = chain[st.mod] && chain[st.mod]._n; const ch = n ? saveP(st.mod, n.P, M().params || []) : loadP(st.mod);
  const txt = st.mod + ' settings (lab-10): ' + (Object.keys(ch).length ? JSON.stringify(ch) : 'all default') + ' · fader ' + Math.round(st.v[st.mod]*100) + '%' + (st.sw[st.mod] ? ' · ' + M().sw + ' on' : '');
  try{ await navigator.clipboard.writeText(txt); $('pCopy').textContent = '✅ COPIED'; }catch(e){ prompt('copy this', txt); }
  setTimeout(()=>{ $('pCopy').textContent = '📋 COPY'; }, 1500); });
let openNotes = {}; try{ openNotes = JSON.parse(localStorage.getItem('labNotes') || '{}'); }catch(e){}
$('units').addEventListener('click', e=>{ const b = e.target.closest('button'); if(b){ if(b.dataset.dice) dice(b.dataset.dice); if(b.dataset.reset) resetP(b.dataset.reset); return; }
  if(e.target.closest('.kn')) return; const r = e.target.closest('.un'); if(!r || !r.dataset.u) return; openNotes[r.dataset.u] = !openNotes[r.dataset.u]; r.classList.toggle('open'); lastUnits = ''; try{ localStorage.setItem('labNotes', JSON.stringify(openNotes)); }catch(_){} });
const mBuf = new Float32Array(1024); let lastInfo = 0;
(function meters(t){ requestAnimationFrame(meters); if(st.mod !== 'RAGE' || !chainOpen) return; const c = chain[st.mod];
  if(t - lastInfo > 150){ lastInfo = t; infoRows(); }
  if(!c || !c._an) return;
  Object.keys(MC).forEach(k=>{ const a = c._an[k]; if(!a) return; let e = 0; if(st.playing){ a.getFloatTimeDomainData(mBuf); for(let i=0;i<mBuf.length;i++) e += mBuf[i]*mBuf[i]; }
    const db = e > 0 ? 10*Math.log10(e/mBuf.length) : -99, w = clamp((db + 48)/48, 0, 1);
    $('mb' + k.replace(' ','')).style.width = (w*100).toFixed(1) + '%'; $('mv' + k.replace(' ','')).textContent = db > -60 ? Math.round(db) : '—'; }); })(0);
layout(); chips(); draw(); readout(); loadLib(); chainShow();
</script>
</body></html>
