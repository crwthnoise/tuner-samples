<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TUNER · Module Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@300;400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* MODULE LAB — one loop, one module, A/B. Same sound code as TUNER (modules/*.worklet.js). */
:root{ --void:#0a0804; --panel:#1a1612; --panel2:#2a2218; --red:#d32f2f; --green:#4fd1a5; --text:#f2ede2; --mute:#8a8176; --faint:#4a443d; --acc:#e0a060;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --ui:'Jura','Arial Narrow',system-ui,sans-serif; color-scheme:dark; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--void); color:var(--text); font-family:var(--ui); overscroll-behavior:none; }
body{ display:flex; flex-direction:column; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px); gap:10px; max-width:520px; margin:0 auto; user-select:none; -webkit-user-select:none; }
.z{ position:relative; background:linear-gradient(#1c1a17,#0e0d0b); border-radius:10px; box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 4px 10px #000; padding:10px 12px; }
.top{ display:flex; align-items:center; gap:10px; }
.top h1{ margin:0; flex:1; font:700 15px var(--ui); letter-spacing:.32em; }
.top h1 b{ color:var(--red); font-weight:700; }
.top h1 small{ display:block; font:300 9px var(--ui); letter-spacing:.5em; color:var(--mute); margin-top:2px; }
.lcd{ background:#040605; border:2px solid #1a1a1a; border-radius:6px; padding:5px 8px; font:700 15px var(--mono); color:var(--green); text-shadow:0 0 6px #4fd1a588; min-width:60px; text-align:center; }
.lcd i{ display:block; font:700 7px var(--mono); color:#2f7a60; letter-spacing:.2em; font-style:normal; text-shadow:none; }
.stage{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:12px; }
#card{ touch-action:none; cursor:ns-resize; }
.readout{ font:700 11px var(--mono); color:var(--mute); text-align:center; letter-spacing:.06em; min-height:14px; }
.readout b{ color:var(--acc); }
.row{ display:flex; gap:6px; align-items:center; }
.row label{ font:700 9px var(--mono); letter-spacing:.18em; color:var(--mute); width:68px; flex:none; }
.seg{ display:flex; flex:1; gap:4px; }
.seg button,.btn{ flex:1; height:36px; border-radius:7px; border:1px solid #2a2724; background:linear-gradient(#22201c,#141210); color:var(--mute); font:700 12px var(--mono); letter-spacing:.08em; cursor:pointer; box-shadow:0 2px 0 #000; }
.seg button.on{ color:#000; background:var(--acc); border-color:var(--acc); }
select{ flex:1; min-width:0; width:100%; text-overflow:ellipsis; height:36px; border-radius:7px; border:1px solid #2a2724; background:#141210; color:var(--text); font:700 11px var(--mono); padding:0 8px; }
.dock{ display:flex; gap:10px; align-items:stretch; }
#ab{ flex:1; height:74px; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
#ab small{ font:500 9px var(--mono); letter-spacing:.14em; color:var(--faint); }
#ab.dry{ color:var(--text); border-color:#5a5550; }
#ab.wet{ color:#000; background:var(--acc); border-color:var(--acc); }
#ab.wet small{ color:#3a2410; }
#play{ flex:none; width:88px; height:88px; border-radius:50%; border:3px solid var(--red); background:radial-gradient(circle,#2a2622,#0e0c0a 70%); box-shadow:0 0 18px #d32f2f55,inset 0 0 0 6px #0a0908; color:var(--text); font-size:30px; cursor:pointer; margin-top:-14px; }
#play.on{ box-shadow:0 0 26px #d32f2faa,inset 0 0 0 6px #0a0908; }
.note{ font:500 10px var(--mono); color:var(--faint); text-align:center; }
.note b{ color:var(--mute); }
</style>
</head><body>
<div class="z top">
  <h1><b>THREAT</b> TUNER<small>MODULE LAB</small></h1>
  <div class="lcd" id="bpmLcd">—<i>BPM</i></div>
  <div class="lcd" id="barLcd">—<i>BAR</i></div>
</div>

<div class="z stage"><div id="card"></div></div>
<div class="readout" id="readout">drag the module up / down · tap the switch = HOLD · double-tap = 0</div>

<div class="z" style="display:flex;flex-direction:column;gap:7px">
  <div class="row"><label>LOOP</label><select id="loopSel"></select></div>
  <div class="row"><label>SLICES</label><div class="seg" data-p="slices"><button data-v="8" class="on">8</button><button data-v="16">16</button></div></div>
  <div class="row"><label>RE-ROLL</label><div class="seg" data-p="reroll"><button data-v="1" class="on">1 BAR</button><button data-v="2">2 BARS</button><button data-v="4">4 BARS</button></div></div>
  <div class="row"><label>PATTERN</label><div class="seg"><button id="seedBtn">🎲 NEW SET</button></div></div>
</div>

<div class="dock">
  <button class="btn wet" id="ab">B · QUIPU<small>TAP = A / B</small></button>
  <button id="play" aria-label="play">▶</button>
</div>
<div class="note">LAB build <b id="ver"></b> · same sound code as the app</div>

<script>
const LAB_VERSION = 'lab-1';
document.getElementById('ver').textContent = LAB_VERSION;
const $ = id=>document.getElementById(id);
const ACC = '#e0a060', COLS = ['#e8dcc4','#e0a060','#c84a28','#8a5a30','#f2ede2','#b07840','#d8b880','#a03a20'];
/* same hash as the worklet → the face shows exactly what you hear */
function quipuHash(a, b, seed){ let h = Math.imul(a|0, 374761393) ^ Math.imul(b|0, 668265263) ^ Math.imul(seed|0, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

const st = { amount:0.5, hold:false, slices:8, reroll:1, seed:1, wet:true, playing:false, bar:-1, slice:-1, heldKey:-1 };
try{ const s = JSON.parse(localStorage.getItem('lab_quipu') || '{}'); Object.assign(st, s, { playing:false, bar:-1, slice:-1, heldKey:-1 }); }catch(e){}
function save(){ try{ localStorage.setItem('lab_quipu', JSON.stringify({ amount:st.amount, hold:st.hold, slices:st.slices, reroll:st.reroll, seed:st.seed, wet:st.wet, loop:st.loop })); }catch(e){} }

/* ---------- AUDIO ---------- */
let ctx = null, node = null, dry = null, wetG = null, src = null, cur = null, ready = null;
async function boot(){ if(ready) return ready; ready = (async()=>{
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.audioWorklet.addModule('modules/quipu.worklet.js?v=' + LAB_VERSION);
  node = new AudioWorkletNode(ctx, 'quipu', { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[2] });
  node.port.onmessage = e=>{ const d = e.data; if(d.pos){ const [b, i] = d.pos.split(':').map(Number); st.bar = b; st.slice = i; st.heldKey = d.held; draw(); } };
  dry = ctx.createGain(); wetG = ctx.createGain(); const out = ctx.createGain(); out.gain.value = 0.9;
  node.connect(wetG); wetG.connect(out); dry.connect(out); out.connect(ctx.destination);
  applyParams(); })(); return ready; }
function applyParams(){ if(!node) return; const P = node.parameters, t = ctx.currentTime;
  P.get('amount').setTargetAtTime(st.amount, t, 0.01); P.get('hold').setValueAtTime(st.hold ? 1 : 0, t); P.get('slices').setValueAtTime(st.slices, t); P.get('reroll').setValueAtTime(st.reroll, t);
  node.port.postMessage({ seed:st.seed });
  wetG.gain.setTargetAtTime(st.wet ? 1 : 0, t, 0.005); dry.gain.setTargetAtTime(st.wet ? 0 : 1, t, 0.005); }

/* ---------- LOOPS (same library as the app: samples/index.json, AAC trimmed seamless with the fingerprint) ---------- */
let LIB = [];
function fpDecode(b64){ const t = atob(b64), u = new Uint8Array(t.length); for(let i=0;i<t.length;i++) u[i] = t.charCodeAt(i); return new Int16Array(u.buffer); }
function trimLoop(s, ab){ if(!s.frames || !s.fp) return ab; const ratio = ab.sampleRate/(s.sr || 44100), len = Math.round(s.frames*ratio); if(len < 16 || ab.length < len) return ab;
  const fp = fpDecode(s.fp), sc = (s.fpScale || 1)/32767, nc = ab.numberOfChannels, chs = []; for(let c=0;c<nc;c++) chs.push(ab.getChannelData(c));
  const mono = i=>{ let v = 0; for(let c=0;c<nc;c++) v += chs[c][i]; return v/nc; };
  const idx = new Int32Array(fp.length); for(let i=0;i<fp.length;i++) idx[i] = Math.round((s.fpAt + i)*ratio);
  const maxD = Math.min(Math.round(6000*ratio), ab.length - len, ab.length - 1 - idx[idx.length-1]); let best = 0, bestE = Infinity;
  for(let d=0; d<=maxD; d++){ let e = 0; for(let i=0;i<fp.length;i++){ const x = mono(idx[i] + d) - fp[i]*sc; e += x*x; if(e >= bestE) break; } if(e < bestE){ bestE = e; best = d; } }
  const out = ctx.createBuffer(nc, len, ab.sampleRate); for(let c=0;c<nc;c++) out.getChannelData(c).set(chs[c].subarray(best, best + len)); return out; }
async function loadLib(){ try{ const r = await fetch('samples/index.json', { cache:'no-cache' }); LIB = (await r.json()).filter(s=>s.file && s.bpm); }catch(e){ LIB = []; }
  const sel = $('loopSel'); sel.innerHTML = ''; const folders = {}; LIB.forEach((s, k)=>{ (folders[s.folder || '—'] = folders[s.folder || '—'] || []).push(k); });
  Object.keys(folders).sort().forEach(f=>{ const g = document.createElement('optgroup'); g.label = f; folders[f].forEach(k=>{ const o = document.createElement('option'); o.value = LIB[k].id; o.textContent = LIB[k].name + ' · ' + LIB[k].bpm; g.appendChild(o); }); sel.appendChild(g); });
  const pick = LIB.find(s=>s.id === st.loop) || LIB.find(s=>/drum/i.test(s.folder || '') && /loop|groove|break|drum/i.test(s.name)) || LIB.find(s=>/drum/i.test(s.folder || '')) || LIB[0];
  if(pick){ sel.value = pick.id; st.loop = pick.id; } }
async function getBuffer(s){ if(s._buf) return s._buf; const r = await fetch('samples/' + s.file.split('/').map(encodeURIComponent).join('/')); const ab = await ctx.decodeAudioData(await r.arrayBuffer()); s._buf = trimLoop(s, ab); return s._buf; }
async function start(){ await boot(); if(ctx.state !== 'running') await ctx.resume(); stopSrc();
  const s = LIB.find(x=>x.id === st.loop); if(!s) return; $('readout').textContent = 'loading ' + s.name + '…';
  const buf = await getBuffer(s); cur = s; const bs = 60/s.bpm, beats = Math.max(1, Math.round(buf.duration/bs));
  const T = ctx.currentTime + 0.08; node.port.postMessage({ t0:T, bs, loopBeats:beats, seed:st.seed, reset:true });
  src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(node); src.connect(dry); src.start(T);
  st.playing = true; $('play').classList.add('on'); $('play').textContent = '■'; $('bpmLcd').innerHTML = s.bpm + '<i>BPM</i>'; renderReadout(); }
function stopSrc(){ if(src){ try{ src.stop(); }catch(e){} try{ src.disconnect(); }catch(e){} src = null; } }
function stop(){ stopSrc(); st.playing = false; st.bar = -1; st.slice = -1; $('play').classList.remove('on'); $('play').textContent = '▶'; $('barLcd').innerHTML = '—<i>BAR</i>'; draw(); }

/* ---------- THE FACE (look v1: woven plate + hanging cords; knot on cord i = the slice that plays there) ---------- */
function mapping(){ const S = st.slices, key = st.hold && st.heldKey >= 0 ? st.heldKey : Math.floor(Math.max(0, st.bar)/st.reroll); const m = [];
  for(let i=0;i<S;i++){ const swap = st.bar >= 0 ? quipuHash(key*64 + i, 1, st.seed) < st.amount : quipuHash(i, 1, st.seed) < st.amount; const kk = st.bar >= 0 ? key*64 + i : i; m.push(swap ? Math.floor(quipuHash(kk, 2, st.seed)*S) : i); } return m; }
function draw(){ const S = st.slices, m = mapping(), W = 230, H = 300, top = 14, gap = (W - 20)/(S - 1);
  let svg = `<line x1="4" y1="${top}" x2="${W-4}" y2="${top}" stroke="${st.hold ? ACC : '#e8dcc4'}" stroke-width="${st.hold ? 5 : 3.5}" ${st.hold ? `style="filter:drop-shadow(0 0 6px ${ACC})"` : ''}/>`;
  for(let i=0;i<S;i++){ const x = 10 + i*gap, play = i === st.slice && st.playing; svg += `<path d="M${x} ${top} Q${x + (i%2 ? 2 : -2)} ${H*0.55} ${x} ${H-6}" fill="none" stroke="${play ? '#fff' : COLS[i%8]}" stroke-width="${play ? 3 : (S > 8 ? 1.6 : 2.2)}" opacity="${play ? 1 : .8}" ${play ? 'style="filter:drop-shadow(0 0 5px #fff)"' : ''}/>`; }
  for(let i=0;i<S;i++){ const x = 10 + i*gap, k = m[i], moved = k !== i, home = top + 26 + (k % 8)*((H - 60)/8) + (S > 8 && k >= 8 ? 14 : 0), r = S > 8 ? 6 : 8;
    const lit = moved || (i === st.slice && st.playing);
    svg += `<circle cx="${x}" cy="${home}" r="${r}" fill="${moved ? '#ffcf8a' : '#3a2414'}" stroke="${lit ? ACC : '#6a4a2a'}" stroke-width="1.6" ${moved ? `style="filter:drop-shadow(0 0 5px ${ACC})"` : ''}/>
      <text x="${x}" y="${home + (S > 8 ? 3 : 3.5)}" font-size="${S > 8 ? 7 : 9}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" fill="${moved ? '#1a0e06' : '#a07a50'}">${k + 1}</text>`; }
  $('card').innerHTML = `<div class="qmod">${['top:7px;left:7px','top:7px;right:7px','bottom:7px;left:7px','bottom:7px;right:7px'].map(p=>`<i class="screw" style="${p}"></i>`).join('')}
    <div class="qplate">QUIPU</div>
    <div class="qzone"><div class="qscr"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${svg}</svg></div>
    <div class="qrail"><div class="qbead" style="bottom:calc(${st.amount*100}% - 4px)"></div></div></div>
    <div class="qseat ${st.hold ? 'on' : ''}" id="seat"><i></i></div><div class="qsl ${st.hold ? 'on' : ''}">HOLD</div></div>`;
  if(st.bar >= 0) $('barLcd').innerHTML = (st.bar + 1) + '<i>BAR</i>'; }
function renderReadout(){ $('readout').innerHTML = `QUIPU <b>${Math.round(st.amount*100)}%</b> · ${st.slices} slices · new set every ${st.reroll} bar${st.reroll > 1 ? 's' : ''}${st.hold ? ' · <b>HOLD</b>' : ''}${st.wet ? '' : ' · <b>A = DRY</b>'}`; }

/* card: drag = amount · tap the switch = HOLD · double-tap = 0 */
let drag = null, lastTap = 0;
$('card').addEventListener('pointerdown', e=>{ e.preventDefault(); try{ $('card').setPointerCapture(e.pointerId); }catch(_){} const onSeat = !!e.target.closest('#seat'); drag = { y0:e.clientY, v0:st.amount, moved:false, seat:onSeat }; });
$('card').addEventListener('pointermove', e=>{ if(!drag) return; const dy = e.clientY - drag.y0; if(!drag.moved && Math.abs(dy) < 4) return; drag.moved = true;
  st.amount = Math.min(1, Math.max(0, drag.v0 - dy/260)); applyParams(); draw(); renderReadout(); });
const end = ()=>{ if(!drag) return; const d = drag; drag = null;
  if(!d.moved){ if(d.seat){ st.hold = !st.hold; applyParams(); }
    else { const t = performance.now(); if(t - lastTap < 320){ st.amount = 0; applyParams(); lastTap = 0; } else lastTap = t; } draw(); renderReadout(); }
  save(); };
$('card').addEventListener('pointerup', end); $('card').addEventListener('pointercancel', end);

document.querySelectorAll('.seg[data-p]').forEach(g=>{ const p = g.dataset.p; g.querySelectorAll('button').forEach(b=>{ b.classList.toggle('on', +b.dataset.v === st[p]);
  b.addEventListener('click', ()=>{ st[p] = +b.dataset.v; g.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x === b)); applyParams(); draw(); renderReadout(); save(); }); }); });
$('seedBtn').addEventListener('click', ()=>{ st.seed = (st.seed % 9999) + 1 + Math.floor(Math.random()*50); applyParams(); draw(); renderReadout(); save(); });
$('ab').addEventListener('click', ()=>{ st.wet = !st.wet; $('ab').className = 'btn ' + (st.wet ? 'wet' : 'dry'); $('ab').innerHTML = (st.wet ? 'B · QUIPU' : 'A · DRY') + '<small>TAP = A / B</small>'; applyParams(); renderReadout(); save(); });
$('play').addEventListener('click', ()=>{ if(st.playing) stop(); else start().catch(e=>{ $('readout').textContent = 'could not play: ' + e.message; }); });
$('loopSel').addEventListener('change', e=>{ st.loop = e.target.value; save(); if(st.playing) start(); });
$('ab').className = 'btn ' + (st.wet ? 'wet' : 'dry'); $('ab').innerHTML = (st.wet ? 'B · QUIPU' : 'A · DRY') + '<small>TAP = A / B</small>';
loadLib(); draw(); renderReadout();
</script>
<style>
/* QUIPU face — look v1 (MOCKS/QUIPU_look_v1.png) */
.qmod{ position:relative; width:250px; height:380px; border-radius:12px; border:1px solid #000; overflow:hidden; display:flex; flex-direction:column; align-items:center; padding:24px 0 12px;
  box-shadow:0 8px 18px #000,inset 0 1px 0 rgba(255,255,255,.1);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px),linear-gradient(#2a1810 0 9%,#7a2a18 9% 11%,#2a1810 11% 86%,#7a2a18 86% 88%,#2a1810 88%); }
.qmod::before,.qmod::after{ content:''; position:absolute; left:0; right:0; height:14px; background:conic-gradient(from 45deg at 50% 50%,#e0a060 0 25%,transparent 0 50%,#c84a28 0 75%,transparent 0) 0 0/14px 14px; opacity:.55; }
.qmod::before{ top:3px; } .qmod::after{ bottom:3px; }
.screw{ position:absolute; width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#d8d2c8,#6a645c 60%,#2a2622); z-index:4; }
.qplate{ font:900 13px var(--ui); letter-spacing:.2em; padding:3px 8px; border-radius:2px; background:var(--acc); color:#1a0e06; z-index:5; margin-bottom:9px; }
.qzone{ flex:1; width:100%; position:relative; }
.qscr{ position:absolute; inset:0 11%; background:#060403; border:2px solid #120a06; border-radius:5px; box-shadow:inset 0 0 14px #000; overflow:hidden; }
.qscr svg{ position:absolute; inset:0; width:100%; height:100%; }
.qrail{ position:absolute; right:4%; top:2%; bottom:2%; width:3px; background:#1e140c; border-radius:2px; }
.qbead{ position:absolute; right:-5px; width:13px; height:8px; border-radius:3px; background:var(--acc); box-shadow:0 0 9px var(--acc); }
.qseat{ width:34px; height:34px; border-radius:50%; margin-top:9px; z-index:5; border:1px solid #3a2a18; background:#120a06; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.qseat i{ width:40%; height:40%; border-radius:50%; background:#2a1a10; }
.qseat.on i{ background:var(--acc); box-shadow:0 0 12px var(--acc); }
.qsl{ font:700 8px var(--mono); color:var(--acc); letter-spacing:.14em; margin-top:3px; z-index:5; opacity:.5; } .qsl.on{ opacity:1; }
</style>
</body></html>
